<!doctype html><html lang="he" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"></head><body><title>הדסק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Secular+One&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: newsroom desk app — side rail (desktop) / bottom tabs (phone), main column of package cards; detail view replaces list */
:root{
  --bg:#f4f4f1; --surface:#ffffff; --raised:#fafaf8; --ink:#171926; --muted:#5f6273; --line:#e2e1dc; --chip:#eeede8; --bar:#4a5bd4;
  --live:#e0204c; --live-soft:#fde7ec; --ok:#12805a; --ok-soft:#e1f3eb; --wait:#9a6500; --wait-soft:#fbf0d6;
  --rail:#171926; --rail-ink:#f4f4f1; --rail-muted:#9fa2b4;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --poster:"Karantina","Secular One","Assistant",sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111219; --surface:#1a1c27; --raised:#20232f; --ink:#f1f0ec; --muted:#a2a5b6; --line:#2b2e3d; --chip:#262938; --bar:#8f9bff;
  --live:#ff4b72; --live-soft:#3a1722; --ok:#3fcf8e; --ok-soft:#12301f; --wait:#eab54d; --wait-soft:#33280e;
  --rail:#0b0c12; --rail-ink:#f1f0ec; --rail-muted:#8c8fa1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111219; --surface:#1a1c27; --raised:#20232f; --ink:#f1f0ec; --muted:#a2a5b6; --line:#2b2e3d; --chip:#262938; --bar:#8f9bff;
  --live:#ff4b72; --live-soft:#3a1722; --ok:#3fcf8e; --ok-soft:#12301f; --wait:#eab54d; --wait-soft:#33280e;
  --rail:#0b0c12; --rail-ink:#f1f0ec; --rail-muted:#8c8fa1; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;direction:rtl;margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--live);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:22px 16px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.5rem}
.brand .on{width:12px;height:12px;border-radius:50%;background:var(--live);box-shadow:0 0 0 4px color-mix(in srgb,var(--live) 30%,transparent)}
.nav{display:grid;gap:4px}
.nav button{background:none;border:0;color:var(--rail-muted);text-align:start;padding:10px 12px;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.nav button[aria-current="page"]{background:color-mix(in srgb,var(--rail-ink) 10%,transparent);color:var(--rail-ink)}
.badge{background:var(--live);color:#fff;border-radius:99px;font-size:.75rem;padding:0 8px;min-width:22px;text-align:center;font-weight:800}
.me{margin-top:auto;display:grid;gap:6px;font-size:.85rem;color:var(--rail-muted)}
.me select{background:color-mix(in srgb,var(--rail-ink) 10%,transparent);color:var(--rail-ink);border:0;border-radius:8px;padding:8px}
.me select option{color:#171926;background:#fff}

main{min-width:0;padding-inline:28px;padding-block:24px 48px;display:grid;gap:20px;align-content:start;max-width:1120px;width:100%}
.demo{background:var(--wait-soft);color:var(--wait);font-size:.85rem;font-weight:700;padding:8px 14px;border-radius:10px}
.top{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:clamp(1.6rem,3vw,2.1rem)}
.top .sub{color:var(--muted);font-size:.95rem}

/* pipeline strip */
.pipe{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.pipe .st{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px;display:inline-flex;gap:6px;align-items:center}
.pipe .st b{color:var(--ink)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pl 1.6s infinite}}
@keyframes pl{50%{opacity:.25}}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:700;font-size:.9rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* package list */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pk{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;text-align:start;padding:0}
.pk:hover{border-color:var(--muted)}
.pk .body{padding:12px 14px 14px;display:grid;gap:8px}
.pk .meta{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.pk h3{font-family:var(--body);font-weight:800;font-size:1rem;line-height:1.35}
.nets{display:flex;flex-wrap:wrap;gap:4px}
.n{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.n.on{background:var(--ok-soft);color:var(--ok)}
.pill{font-size:.75rem;font-weight:800;padding:2px 9px;border-radius:99px;width:fit-content}
.p-wait{background:var(--live-soft);color:var(--live)}
.p-part{background:var(--wait-soft);color:var(--wait)}
.p-done{background:var(--ok-soft);color:var(--ok)}
.p-proc{background:var(--chip);color:var(--muted)}

/* designed templates (fixed brand look, intentionally theme-independent: they are the images that get posted) */
.tpl{position:relative;aspect-ratio:1/1;max-width:100%;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:7%;
  background:radial-gradient(120% 90% at 80% 10%,hsl(var(--h) 80% 55%) 0%,hsl(calc(var(--h) + 30) 70% 28%) 55%,#0d0e16 100%)}
.tpl.v{aspect-ratio:9/16}
.tpl .rib{position:absolute;top:7%;right:7%;background:#e0204c;color:#fff;font-family:var(--display);font-size:clamp(.6rem,2.6cqw,1rem);padding:.2em .7em;border-radius:4px}
.tpl{container-type:inline-size}
.tpl .hl{font-family:var(--poster);font-weight:700;font-size:13cqw;line-height:.92;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.tpl .foot{margin-top:5cqw;display:flex;justify-content:space-between;align-items:center;font-size:3.6cqw;font-weight:800;opacity:.9;border-top:2px solid rgba(255,255,255,.5);padding-top:3cqw}
.tpl.quote{background:linear-gradient(160deg,#fff4d6 0%,#ffd9e2 100%);color:#171926;justify-content:center}
.tpl.quote .qm{font-family:var(--display);font-size:30cqw;line-height:.6;color:#e0204c}
.tpl.quote .hl{text-shadow:none;font-size:11cqw}
.tpl.quote .foot{border-color:rgba(23,25,38,.35)}
.tpl.proc{background:repeating-linear-gradient(135deg,var(--chip) 0 12px,var(--raised) 12px 24px);color:var(--muted);justify-content:center;align-items:center;text-align:center}
.tpl.proc .hl{font-family:var(--body);font-weight:800;font-size:5cqw;text-shadow:none}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play span{width:18cqw;height:18cqw;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:7cqw}
.caps{font-family:var(--body);font-weight:800;font-size:7cqw;line-height:1.3;text-align:center;margin-bottom:12cqw;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.caps i{font-style:normal;padding:0 .12em;border-radius:.2em}
.caps i.hi{background:#ffd400;color:#171926;text-shadow:none}
.pk .thumb .tpl.v{aspect-ratio:1/1}
.pk .thumb .caps{font-size:6cqw;margin-bottom:4cqw}

/* detail */
.back{background:none;border:0;color:var(--muted);font-weight:700;padding:0;width:fit-content}
.detail{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
.media{display:grid;gap:10px}
.media .tpl{border-radius:14px}
.media .tpl.v{max-width:300px;width:100%;justify-self:center}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;font-size:.9rem}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.panel h2{font-size:1.2rem}
.trail{display:flex;gap:6px;flex-wrap:wrap;font-size:.8rem}
.trail span{background:var(--chip);border-radius:99px;padding:2px 10px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--live)}
.copytext{white-space:pre-wrap;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:.98rem;min-height:120px}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row.done{background:var(--ok-soft);border-color:transparent}
.row .nm{font-weight:800}
.row .who{font-size:.85rem;color:var(--muted)}
.row.done .who{color:var(--ok);font-weight:700}
.mark{border:0;border-radius:10px;padding:8px 14px;font-weight:800;background:var(--live);color:#fff}
.unmark{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;font-size:.85rem;color:var(--muted)}
.transcript{display:grid;gap:8px;font-size:.95rem;max-height:220px;overflow:auto}
.transcript p{display:grid;grid-template-columns:52px 1fr;gap:8px}
.ver{font-size:.82rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ver b{color:var(--ink)}
.edited{background:var(--wait-soft);color:var(--wait);font-weight:800;font-size:.75rem;padding:1px 8px;border-radius:99px}
textarea{width:100%;min-height:150px;font:inherit;font-size:.98rem;line-height:1.55;background:var(--surface);color:var(--ink);border:2px solid var(--live);border-radius:10px;padding:12px;resize:vertical}
.ai-box{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.ai-box .lbl{font-weight:800;font-size:.9rem;display:flex;gap:6px;align-items:center}
.ai-box .lbl i{font-style:normal;background:var(--live-soft);color:var(--live);border-radius:99px;padding:0 8px;font-size:.75rem}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--raised);border-radius:99px;padding:5px 12px;font-weight:700;font-size:.85rem}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.busy{color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:no-preference){.busy{animation:pl 1.2s infinite}}
details.hist summary{cursor:pointer;font-weight:800;font-size:.9rem}
.hlist{display:grid;gap:6px;margin-top:10px}
.hv{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.85rem}
.hv.cur{border-color:var(--ok);background:var(--ok-soft)}
.hv .tx{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46ch}
.warn{font-size:.8rem;color:var(--wait);font-weight:800}
.thread{display:grid;gap:10px}
.cm{display:grid;grid-template-columns:34px 1fr;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.cm .h{font-size:.82rem;color:var(--muted)}
.cm .h b{color:var(--ink)}
.cm.sys .av{background:var(--live-soft);color:var(--live)}
.cm.sys p{color:var(--muted);font-size:.9rem}
.imgedit{display:grid;gap:6px}
.imgedit input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;width:100%}
.transcript .t{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:2px}
.kpi .v{font-family:var(--display);font-size:2.2rem;line-height:1.1}
.kpi .l{color:var(--muted);font-size:.9rem;font-weight:700}
.kpi.alert .v{color:var(--live)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:90px 1fr 32px;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:14px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--bar);border-radius:99px}
.bar.wide{grid-template-columns:120px 1fr 64px}
.linkin{display:grid;gap:6px;grid-column:1/-1}
.linkin input{border:2px solid var(--live);background:var(--surface);border-radius:10px;padding:8px 12px;width:100%;direction:ltr;text-align:left}
.perf td,.perf th{font-variant-numeric:tabular-nums}
.perf a{color:var(--bar);font-weight:700;text-decoration:none}
.newform{display:grid;gap:18px;max-width:720px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.newform textarea{border-color:var(--line);min-height:130px}
.newform input[type=url],.newform input[type=file]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.9rem;cursor:pointer}
.heads{display:grid;gap:6px}
.heads div{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.heads div.cur{border-color:var(--ok);background:var(--ok-soft)}
.radar-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.radar-bar select,.radar-bar input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px}
.radar-bar input{flex:1;min-width:160px}
.thr{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.thr b{color:var(--ink)}
.feedlist{display:grid;gap:8px}
.ni{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:start}
.ni.skip{background:var(--raised)}
.ni.skip h3,.ni.skip .why{opacity:.75}
.score{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;line-height:1;background:var(--chip);color:var(--muted)}
.score small{font-family:var(--body);font-size:.62rem;font-weight:800;display:block;margin-top:-6px}
.score.hi{background:var(--ok-soft);color:var(--ok)}
.score.mid{background:var(--wait-soft);color:var(--wait)}
.ni h3{font-family:var(--body);font-weight:800;font-size:1rem;line-height:1.35}
.ni .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted);margin-top:4px}
.ni .why{font-size:.88rem;margin-top:6px}
.ni .why b{color:var(--ai,var(--live))}
.srcs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.srcbtn{border:0;background:var(--chip);border-radius:99px;padding:1px 9px;font-size:.78rem;font-weight:800;color:var(--muted)}
.ni .act{display:grid;gap:6px;justify-items:end}
.divider{font-size:.8rem;font-weight:800;color:var(--muted);letter-spacing:.04em;padding-top:8px;border-top:1px dashed var(--line)}
@media (max-width:560px){.ni{grid-template-columns:44px 1fr}.ni .act{grid-column:1/-1;justify-items:start}.score{width:44px;height:44px;font-size:1.25rem}}
.insights{background:var(--live-soft);border-radius:14px;padding:18px;display:grid;gap:10px}
.insights h2{font-size:1.2rem}
.insights ul{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.insights li b{color:var(--live)}
.kpi .d{font-size:.8rem;font-weight:800}
.up{color:var(--ok)} .down{color:var(--live)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:start;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700;font-size:.82rem}
.feed{display:grid;gap:8px;font-size:.9rem;max-height:280px;overflow:auto}
.feed div{display:grid;grid-template-columns:48px 1fr;gap:8px}
.feed .t{color:var(--muted)}
.stuck{display:grid;gap:8px}
.stuck button{display:grid;grid-template-columns:1fr auto;gap:8px;text-align:start;background:var(--live-soft);border:0;border-radius:10px;padding:10px 12px}
.stuck b{font-weight:800}
.stuck span{color:var(--live);font-weight:800;font-size:.85rem}

/* settings */
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .s{font-size:.85rem;color:var(--muted)}
.sw{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--chip);border:1px solid var(--line);position:relative;cursor:pointer;margin:0}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:right .15s}
.sw:checked{background:var(--ok);border-color:var(--ok)}
.sw:checked::after{right:20px}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tpls figure{margin:0;display:grid;gap:6px;font-size:.85rem;font-weight:700;text-align:center}
.tpls .tpl{border-radius:10px}
.voice{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.field{display:grid;gap:4px;font-size:.9rem;font-weight:700}
.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:20;max-width:calc(100% - 32px)}

@media (max-width:900px){
  .detail{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .nav button{font-size:.78rem!important}
  .app{grid-template-columns:1fr}
  .rail{position:fixed;bottom:0;top:auto;inset-inline:0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;gap:0}
  .brand,.me{display:none}
  .nav{grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
  .nav button{justify-content:center;flex-direction:column;gap:2px;font-size:.85rem;padding:8px 4px}
  main{padding-inline:16px;padding-block:16px 96px}
  .mobile-me{display:flex!important}
  .toast{bottom:84px}
  .tpls{grid-template-columns:repeat(3,1fr)}
}
.mobile-me{display:none;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.mobile-me select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><span class="on" aria-hidden="true"></span>הדסק</div>
    <nav class="nav" aria-label="ניווט">
      <button data-view="radar"><span>ידיעות נכנסות</span></button>
      <button data-view="list"><span>חבילות</span><span class="badge num" id="waitBadge">0</span></button>

function forcePackage(i){
  const n=NEWS[i];clock++;
  const p={id:Math.max(...P.map(x=>x.id))+1,kind:'proc',h:(clock*53)%360,cat:n.cat,src:n.src.join(', ')+' · הוחזר ע"י '+S.me,at:hm(clock),targets:['ig','fb','x'],hl:n.t,tx:{},up:{}};
  P.unshift(p);n.made=p.id;
  LOG.unshift({at:hm(clock),by:S.me,pid:p.id,text:'החזיר/ה ידיעה שלא נבחרה: '+n.t});
  render();toast('נשלח ל-Claude. החבילה תופיע בחבילות בעוד רגע');
  setTimeout(()=>{p.kind='hot';p.heads=[n.t,'רשמי: '+n.t,n.t+', וזה רק ההתחלה','כולם מדברים על זה: '+n.t,n.t+'? הנה מה שידוע'];
    p.tx={ig:n.t+' 🔥\nמה דעתכם? כתבו בתגובות 👇',fb:n.t+'.\n\nמה אתם אומרים?',x:n.t.slice(0,120)};
    clock++;LOG.unshift({at:hm(clock),by:'Claude',pid:p.id,text:'הכין חבילה: '+n.t});render();toast('החבילה מוכנה ✓')},2200);
}
const MODES={short:'קצר יותר',noemoji:'בלי אימוג\'ים',formal:'רשמי יותר',other:'גרסה אחרת'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const netName=id=>NETS.find(n=>n.id===id).name;

function status(p){
  if(p.kind==='proc')return 'proc';
  const n=p.targets.filter(t=>p.up[t]).length;
  return n===0?'wait':n===p.targets.length?'done':'part';
}
const ST={wait:['p-wait','ממתינה להעלאה'],part:['p-part','עלתה חלקית'],done:['p-done','עלתה לכל הרשתות'],proc:['p-proc','בהכנה...']};

function tpl(p,big){

  if(p.kind==='quote')return `<div class="tpl quote" style="--h:${p.h}"><span class="qm">"</span><p class="hl">${esc(p.img||p.hl)}</p><div class="foot"><span>${esc(p.who)}</span><span>שם הדף</span></div></div>`;
  if(p.kind==='video'){
    const words=p.caps.map((w,i)=>`<i data-w="${i}">${esc(w)}</i>`).join(' ');
    return `<div class="tpl ${big?'v':'v'}" style="--h:${p.h}"><span class="rib">ראיון</span>${big?'':'<div class="play" aria-hidden="true"><span>▶</span></div>'}<p class="caps">${words}</p></div>`;
  }
  return `<div class="tpl" style="--h:${p.h}"><span class="rib">חדשות חמות</span><p class="hl">${esc(p.img||p.hl)}</p><div class="foot"><span>${esc(p.cat)}</span><span>שם הדף</span></div></div>`;

          ${S.marking===t&&!u?`<form class="linkin" data-linkform><label for="linkIn" class="sub">הדביקו את הקישור לפוסט ב${netName(t)}. כך המערכת תמשוך את הנתונים שלו</label><input id="linkIn" type="url" inputmode="url" placeholder="https://"><div class="btnrow"><button class="mark" type="submit">אישור</button><button class="unmark" type="button" data-markcancel>ביטול</button></div></form>`:''}</div>`}).join('')}</div>

        <div class="btnrow"><button class="btn" data-copytr>העתקת התמלול</button></div></div>`:''}`}

function createItem(){
  const src=S.src||'text';
  let hl,raw='',vid=false;
  if(src==='text'){raw=$('#nText').value.trim();if(!raw){toast('כתבו טקסט או רעיון');return}hl=raw.split(/[.\n]/)[0].slice(0,70)}
  else if(src==='link'){const v=$('#nLink').value.trim();if(!/^https?:\/\/\S+\.\S+/.test(v)){toast('הדביקו קישור שמתחיל ב-https://');return}let host='';try{host=new URL(v).hostname.replace('www.','')}catch(e){}hl='הידיעה מ-'+host}
  else{const fl=$('#nVid').files[0];if(!fl){toast('בחרו קובץ וידאו');return}vid=true;hl='סרטון: '+fl.name.replace(/\.[^.]+$/,'')}
  const targets=NETS.filter(n=>$('#net_'+n.id).checked).map(n=>n.id);
  if(!targets.length){toast('בחרו לפחות רשת אחת');return}
  const wantHeads=$('#wHeads').checked, wantTr=vid&&$('#wTr')&&$('#wTr').checked, urgent=$('#nUrgent').checked;
  clock++;
  const p={id:Math.max(...P.map(x=>x.id))+1,kind:'proc',h:(clock*37)%360,cat:'אייטם ידני',src:'הוזן ע"י '+S.me+(urgent?' · דחוף':''),at:hm(clock),targets,hl,tx:{},up:{}};
  P.unshift(p);
  LOG.unshift({at:hm(clock),by:S.me,pid:p.id,text:'הוסיף/ה אייטם חדש: '+hl});
  S.view='list';S.open=p.id;S.tab=null;render();scrollTo(0,0);
  toast(urgent?'נשלח ל-Claude. כל הצוות קיבל התראה':'נשלח ל-Claude. החבילה תהיה מוכנה בעוד רגע');
  setTimeout(()=>{
    const core=hl;
    p.kind=vid?'video':'hot';
    if(wantHeads)p.heads=[core,'רשמי: '+core,core+', וזה רק ההתחלה','כולם מדברים על זה: '+core,core+'? הנה מה שידוע'];
    const body=raw||core;
    const all={ig:core+' 🔥\n'+(raw&&raw!==core?raw.slice(core.length).replace(/^[.\s]+/,'')+'\n':'')+'מה דעתכם? כתבו בתגובות 👇',
      fb:body+'\n\nמה אתם אומרים?',tt:core+' 👀',x:core.slice(0,120),yt:core+' | שם הדף'};
    targets.forEach(t=>p.tx[t]=all[t]);
    if(vid){p.caps=core.replace('סרטון: ','').split(/\s+/).slice(0,6);if(p.caps.length<2)p.caps=['ככה','זה','נראה','מבפנים'];if(wantTr)p.tr=[['00:01','(כאן יופיע התמלול המלא של הסרטון, עם חותמות זמן)'],['00:09','(Claude גם מסמן את 3 הציטוטים החזקים)']]}
    clock++;LOG.unshift({at:hm(clock),by:'Claude',pid:p.id,text:'הכין חבילה: '+core});
    if(S.open===p.id||S.view==='list')render();
    toast('החבילה מוכנה ✓');
  },2600);
}

function perfPanel(p){
  const rows=Object.entries(p.up);
  if(!rows.length)return '';
  return `<div class="panel"><h2>ביצועים</h2><p class="sub">מתעדכן אוטומטית כל שעה מהרשתות.</p>
    <div style="overflow-x:auto"><table class="perf"><thead><tr><th>רשת</th><th>צפיות</th><th>לייקים</th><th>תגובות</th><th>שיתופים</th><th></th></tr></thead><tbody>
    ${rows.map(([t,u])=>u.stats?`<tr><td><b>${netName(t)}</b></td><td>${fmt(u.stats.v)}</td><td>${fmt(u.stats.l)}</td><td>${fmt(u.stats.c)}</td><td>${fmt(u.stats.s)}</td><td><button class="unmark" data-fake>לפוסט ↗</button></td></tr>`
      :`<tr><td><b>${netName(t)}</b></td><td colspan="5" class="sub">הנתונים יגיעו תוך כשעה</td></tr>`).join('')}
    </tbody></table></div></div>`;
}

function renderPerf(){
  const tplAvg=[['וידאו / ראיון',18600],['ציטוט',10400],['חדשות חמות',7900]];
  const hours=[['07–09',6200],['09–12',7100],['12–15',6800],['15–18',8300],['18–21',13900],['21–24',11200]];
  const eng=[['טיקטוק',9.4],['אינסטגרם',7.1],['יוטיוב',5.2],['פייסבוק',3.8],['X',2.1]];
  const bars=(arr,unit,f)=>{const mx=Math.max(...arr.map(a=>a[1]));return `<div class="bars">${arr.map(([n,v])=>`<div class="bar wide" title="${n}: ${f(v)}${unit}"><span>${n}</span><div class="track"><div class="fill" style="width:${v/mx*100}%"></div></div><span class="num">${f(v)}${unit}</span></div>`).join('')}</div>`};
  const top=P.filter(p=>views(p)).sort((a,b)=>views(b)-views(a)).slice(0,5);
  return header('ביצועים','30 הימים האחרונים · נתוני דוגמה')+
  `<div class="kpis">
    <div class="kpi"><span class="v num">2.4M</span><span class="l">צפיות</span><span class="d up">▲ 18% מהחודש הקודם</span></div>
    <div class="kpi"><span class="v num">9.2K</span><span class="l">ממוצע צפיות לפוסט</span><span class="d up">▲ 11%</span></div>
    <div class="kpi"><span class="v num">31K</span><span class="l">תגובות</span><span class="d down">▼ 4%</span></div>
    <div class="kpi"><span class="v num">262</span><span class="l">פוסטים שעלו</span><span class="d up">▲ 23%</span></div>
  </div>
  <div class="insights"><h2>מה Claude למד החודש</h2><ul>
    <li>סרטוני ראיון מקבלים <b>פי 2.3</b> צפיות מתמונות. כדאי להעלות יותר וידאו.</li>
    <li>פוסטים שעולים בין <b>18:00 ל-21:00</b> מקבלים הכי הרבה צפיות, אבל רוב ההעלאות שלכם הן בבוקר.</li>
    <li>כותרות שנפתחות בשאלה מקבלות <b>40% יותר תגובות</b>. מעכשיו אציע אותן יותר.</li>
    <li>בפייסבוק המעורבות יורדת כבר 3 שבועות. שווה לבדוק אורך טקסט ושעות.</li>
  </ul></div>
  <div class="two">
    <div class="panel"><h2>ממוצע צפיות לפי סוג פוסט</h2>${bars(tplAvg,'',fmt)}</div>
    <div class="panel"><h2>ממוצע צפיות לפי שעת העלאה</h2>${bars(hours,'',fmt)}</div>
    <div class="panel"><h2>מעורבות לפי רשת</h2><p class="sub">לייקים, תגובות ושיתופים ביחס לצפיות</p>${bars(eng,'%',v=>v.toFixed(1))}</div>
    <div class="panel"><h2>הפוסטים המובילים היום</h2>
      <div style="overflow-x:auto"><table class="perf"><thead><tr><th>פוסט</th><th>צפיות</th><th>העלו</th></tr></thead><tbody>
      ${top.map(p=>`<tr><td><button class="back" style="color:var(--ink);text-align:start" data-open="${p.id}">${esc(p.hl)}</button></td><td>${fmt(views(p))}</td><td>${[...new Set(Object.values(p.up).map(u=>u.by))].join(', ')}</td></tr>`).join('')}
      </tbody></table></div></div>
  </div>`;
}

function commentsPanel(p){
  const cs=COMMENTS[p.id]||[];
  return `<div class="panel"><h2>הערות לצוות</h2>
    <div class="thread">${cs.length?cs.map(c=>`<div class="cm ${c.sys?'sys':''}"><span class="av">${c.sys?'AI':esc(c.by[0])}</span><div><div class="h"><b>${esc(c.by)}</b> · <span class="num">${c.at}</span></div><p>${esc(c.text)}</p></div></div>`).join(''):'<p class="sub">אין הערות עדיין.</p>'}</div>
    <form class="ask" data-cmform><input id="cmIn" placeholder="כתבו הערה לצוות..."><button class="btn primary" type="submit">שליחה</button></form>
  </div>`;
}

function allUploads(){
  const out=[];P.forEach(p=>Object.entries(p.up).forEach(([n,u])=>out.push({p,n,...u})));
  return out.sort((a,b)=>toMin(b.at)-toMin(a.at));
}

function renderDash(){
  const ups=allUploads();
  const ready=P.filter(p=>p.kind!=='proc');
  const cnt=k=>ready.filter(p=>status(p)===k).length;
  const stuck=ready.filter(p=>status(p)==='wait'&&clock-toMin(p.at)>=60);
  const perNet=NETS.map(n=>({n,v:ups.filter(u=>u.n===n.id).length}));
  const max=Math.max(1,...perNet.map(x=>x.v));
  const perPerson=TEAM.map(t=>({t,v:ups.filter(u=>u.by===t.name).length,last:ups.find(u=>u.by===t.name)}));
  return header('לוח מנהלת','היום, נכון לשעה '+hm(clock))+
  `<div class="kpis">
    <div class="kpi"><span class="v num">${ready.length}</span><span class="l">חבילות הוכנו</span></div>
    <div class="kpi"><span class="v num">${ups.length}</span><span class="l">העלאות לרשתות</span></div>
    <div class="kpi"><span class="v num">${cnt('part')}</span><span class="l">עלו חלקית</span></div>
    <div class="kpi ${cnt('wait')?'alert':''}"><span class="v num">${cnt('wait')}</span><span class="l">לא עלו לאף רשת</span></div>
  </div>
  <div class="two">
    <div class="panel"><h2>תקועות מעל שעה</h2>
      ${stuck.length?`<div class="stuck">${stuck.map(p=>`<button data-open="${p.id}"><b>${esc(p.hl)}</b><span class="num">${Math.floor((clock-toMin(p.at))/60)} ש' ${(clock-toMin(p.at))%60} ד'</span></button>`).join('')}</div>`:'<p class="sub">אין חבילות תקועות. כל הכבוד לצוות.</p>'}
    </div>
    <div class="panel"><h2>העלאות לפי רשת</h2>
      <div class="bars">${perNet.map(x=>`<div class="bar"><span>${x.n.name}</span><div class="track"><div class="fill" style="width:${x.v/max*100}%"></div></div><span class="num">${x.v}</span></div>`).join('')}</div>
    </div>
    <div class="panel"><h2>מי העלה מה</h2>
      <div style="overflow-x:auto"><table><thead><tr><th>שם</th><th>תפקיד</th><th>העלאות היום</th><th>אחרונה</th></tr></thead>
      <tbody>${perPerson.map(x=>`<tr><td><b>${x.t.name}</b></td><td>${x.t.role}</td><td class="num">${x.v}</td><td class="num">${x.last?x.last.at+' · '+netName(x.last.n):'·'}</td></tr>`).join('')}</tbody></table></div>
    </div>
    <div class="panel"><h2>פעילות אחרונה</h2>
      <div class="feed">${[...ups.map(u=>({at:u.at,by:u.by,text:`העלה/תה ל${netName(u.n)}: ${u.p.hl}`})),...LOG].sort((a,b)=>toMin(b.at)-toMin(a.at)).map(u=>`<div><span class="t num">${u.at}</span><span><b>${esc(u.by)}</b> ${esc(u.text)}</span></div>`).join('')}</div>
    </div>
  </div>`;
}

function renderSettings(){
  const mini=[P[0],P[2],P[1]];
  return header('הגדרות','מה המערכת סורקת, איך היא כותבת ואיך היא מעצבת')+
  `<div class="two">
    <div class="panel"><h2>מקורות חדשות</h2>
      <div class="list">${SOURCES.map((s,i)=>`<div class="item"><div><b>${esc(s.name)}</b><div class="s">${esc(s.s)}</div></div><input type="checkbox" class="sw" id="src${i}" data-src="${i}" ${s.on?'checked':''} aria-label="סריקת ${esc(s.name)}"></div>`).join('')}</div>
      <div class="item"><div><b>חיפושים ב-Google News</b><div class="s">"גמר ריאליטי" · "סינגל חדש" · "עונה שנייה" · "הופעה" · + 12 מונחים</div></div><input type="checkbox" class="sw" id="gnews" checked aria-label="חיפושים ב-Google News"></div>
      <div class="item"><div><b>מסוננים החוצה</b><div class="s">פוליטיקה · ביטחון · תאונות · פלילים. תוכן שיווקי מסומן ויורד לסוף</div></div><input type="checkbox" class="sw" id="excl" checked aria-label="סינון נושאים"></div>
      <label class="field" for="freq">תדירות סריקה
        <select id="freq"><option>כל 5 דקות</option><option selected>כל 10 דקות</option><option>כל 30 דקות</option></select></label>
    </div>
    <div class="panel"><h2>הסגנון של הדף</h2>
      <p class="sub">נלמד מ-20 פוסטים של הדף. Claude כותב לפי הכללים האלה.</p>
      <ul class="voice"><li>פותחים במשפט שמעורר סקרנות, לא בעובדה יבשה</li><li>2–3 אימוג'ים בפוסט, אף פעם לא ברצף</li><li>שואלים את הקהל שאלה בסוף</li><li>לא כותבים שמועה כעובדה. אם זה לא מאושר, כותבים "לפי הדיווח"</li><li>בטיקטוק: עד 15 מילים</li></ul>
    </div>
    <div class="panel"><h2>תבניות עיצוב</h2>
      <div class="tpls">${mini.map((p,i)=>`<figure>${tpl(p,false)}<figcaption>${['חדשות חמות','ציטוט','ראיון / וידאו'][i]}</figcaption></figure>`).join('')}</div>
    </div>
    <div class="panel"><h2>הצוות</h2>
      <div class="list">${TEAM.map((t,i)=>`<div class="item"><div><b>${t.name}</b><div class="s">${t.role} · התראות בוואטסאפ</div></div><input type="checkbox" class="sw" id="wa${i}" checked aria-label="התראות בוואטסאפ ל${t.name}"></div>`).join('')}</div>
    </div>
  </div>`;
}

let capTimer=null;
function render(){
  clearInterval(capTimer);
  const m=$('#main');
  m.innerHTML=S.view==='list'?(S.open?renderDetail():renderList()):S.view==='dash'?renderDash():S.view==='perf'?renderPerf():S.view==='radar'?renderRadar():S.view==='new'?renderNew():renderSettings();
  nav();
  const ms=$('#meSel2');if(ms)ms.addEventListener('change',e=>setMe(e.target.value));
  startCaps();
}

function startCaps(){
  const boxes=[...document.querySelectorAll('.caps')];
  if(!boxes.length)return;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let i=0;
  const step=()=>{boxes.forEach(b=>{const w=b.querySelectorAll('i');w.forEach((x,j)=>x.classList.toggle('hi',j===i%w.length))});i++};
  step();
  if(!reduce)capTimer=setInterval(step,550);
}

function setMe(v){S.me=v;$('#meSel').value=v;render()}

let tt=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

function copy(text){
  const done=()=>toast('הועתק. אפשר להדביק ברשת');
  try{navigator.clipboard.writeText(text).then(done,()=>fallback())}catch(e){fallback()}
  function fallback(){const el=$('#copytext');if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('סמנתי את הטקסט. העתיקו עם Ctrl+C')}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.view){S.marking=null;S.view=b.dataset.view;S.open=null;render();scrollTo(0,0);return}
  if(b.dataset.filter){S.filter=b.dataset.filter;render();return}
  if(b.dataset.open){S.view='list';S.open=+b.dataset.open;S.tab=null;S.marking=null;S.editing=false;S.imgEdit=false;render();scrollTo(0,0);return}
  if('back' in b.dataset){S.open=null;render();return}
  if(b.dataset.tab){S.tab=b.dataset.tab;S.editing=false;render();return}
  const p=P.find(x=>x.id===S.open);
  if('copy' in b.dataset&&p){copy(p.tx[S.tab]);return}
  if('copytr' in b.dataset&&p){copy(p.tr.map(r=>r[0]+' '+r[1]).join('\n'));return}
  if('edit' in b.dataset){S.editing=true;render();const t=$('#editArea');if(t)t.focus();return}
  if('cancel' in b.dataset){S.editing=false;render();return}
  if('save' in b.dataset&&p){const v=$('#editArea').value.trim();S.editing=false;if(v&&v!==p.tx[S.tab]){addVersion(p,S.tab,v,'עריכה ידנית');render();toast('נשמר. כל הצוות רואה את הגרסה החדשה')}else render();return}
  if(b.dataset.rw&&p){runRewrite(p,b.dataset.rw,'');return}
  if(b.dataset.restore&&p){const v=hist(p,S.tab)[+b.dataset.restore];addVersion(p,S.tab,v.text,'שחזור גרסה '+(+b.dataset.restore+1));render();toast('הגרסה שוחזרה');return}
  if('imgedit' in b.dataset){S.imgEdit=!S.imgEdit;render();return}
  if('imgcancel' in b.dataset){S.imgEdit=false;render();return}
  if('imgsave' in b.dataset&&p){const v=$('#imgHl').value.trim();S.imgEdit=false;if(v){p.img=v;clock++;LOG.unshift({at:hm(clock),by:S.me,pid:p.id,text:'שינה/תה את הכותרת בתמונה: '+p.hl})}render();toast('התמונה עודכנה');return}
  if(b.dataset.rcat){S.rcat=b.dataset.rcat;render();return}
  if(b.dataset.srcs){const i=+b.dataset.srcs;S.rsrc=S.rsrc===i?null:i;render();return}
  if(b.dataset.force){forcePackage(+b.dataset.force);return}
  if('fake' in b.dataset){toast('במערכת האמיתית נפתח הפוסט ברשת');return}
  if('new' in b.dataset){S.view='new';S.open=null;S.src='text';render();scrollTo(0,0);return}
  if(b.dataset.src){S.src=b.dataset.src;render();return}
  if(b.dataset.pick&&p){p.hl=p.img=p.heads[+b.dataset.pick];clock++;LOG.unshift({at:hm(clock),by:S.me,pid:p.id,text:'בחר/ה כותרת: '+p.hl});render();toast('הכותרת עודכנה בחבילה ובתמונה');return}
  if('dl' in b.dataset){toast('במערכת האמיתית הקובץ יורד לטלפון או למחשב');return}
  if(b.dataset.mark&&p){S.marking=b.dataset.mark;render();const i=$('#linkIn');if(i)i.focus();return}
  if('markcancel' in b.dataset){S.marking=null;render();return}
  if(false){toast(`נרשם ✓ ${netName(b.dataset.mark)} · ${S.me} · ${hm(clock)}`);return}
  if(b.dataset.unmark&&p){delete p.up[b.dataset.unmark];render();toast('הסימון בוטל');return}
});
function runRewrite(p,mode,instr){
  const k=S.tab;S.busy=true;render();
  setTimeout(()=>{S.busy=false;addVersion(p,k,rewrite(p,k,mode,instr),mode?MODES[mode]:'בקשה: '+instr);if(S.open===p.id)render();toast('Claude כתב גרסה חדשה. אפשר לשחזר את הקודמת מההיסטוריה')},1100);
}
document.addEventListener('input',e=>{
  if(e.target.id==='rq'){S.rq=e.target.value;const pos=e.target.selectionStart;render();const i=$('#rq');if(i){i.focus();i.setSelectionRange(pos,pos)}}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if('newform' in e.target.dataset){createItem();return}
  const p=P.find(x=>x.id===S.open);if(!p)return;
  if('linkform' in e.target.dataset){const v=$('#linkIn').value.trim();if(!/^https?:\/\/\S+\.\S+/.test(v)){toast('הקישור צריך להתחיל ב-https:// ולהוביל לפוסט');return}
    const t=S.marking;clock++;p.up[t]={by:S.me,at:hm(clock),link:v,stats:null};S.marking=null;render();toast(`נרשם ✓ ${netName(t)} · ${S.me} · ${hm(clock)}`);return}
  if('askform' in e.target.dataset){const v=$('#askIn').value.trim();if(v)runRewrite(p,null,v);return}
  if('cmform' in e.target.dataset){const v=$('#cmIn').value.trim();if(!v)return;clock++;(COMMENTS[p.id]=COMMENTS[p.id]||[]).push({by:S.me,at:hm(clock),text:v});LOG.unshift({at:hm(clock),by:S.me,pid:p.id,text:'הגיב/ה על '+p.hl});render();toast('ההערה נשלחה לצוות')}
});
document.addEventListener('change',e=>{
  if(e.target.id==='rsort'){S.rsort=e.target.value;render();return}
  if(e.target.id==='rshow'){S.rshow=e.target.value;render();return}
  if(e.target.dataset.src!==undefined){const s=SOURCES[+e.target.dataset.src];s.on=e.target.checked;toast(s.on?`${s.name} נכלל בסריקה`:`${s.name} הושבת`)}
});

hist(P[0],'fb');
$('#meSel').innerHTML=TEAM.map(t=>`<option ${t.name===S.me?'selected':''}>${t.name}</option>`).join('');
$('#meSel').addEventListener('change',e=>setMe(e.target.value));
render();
</script>
</body></html>
